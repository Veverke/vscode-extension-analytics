name: Request Extension Tracking
description: Request that an extension be tracked in the analytics registry
title: "[Tracking Request] "
# IMPORTANT: `labels: ["tracking-request"]` is applied by GitHub AT CREATION
# TIME (so the user sees the label while the issue is being created) ONLY IF
# the `tracking-request` label already exists in the repository.
#   - If the label exists -> GitHub auto-applies it on creation. ✓
#   - If the label does NOT exist -> GitHub fails to load this template
#     entirely (blank issue with no body). ✗
# So the `tracking-request` label MUST already exist in the repo (created once
# in repo Settings -> Labels, or by one successful run of the workflow). The
# process-tracking-requests workflow also auto-creates it as a fallback.
labels: ["tracking-request"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an extension to be tracked! Please fill out the fields below.

  - type: input
    id: extension-id
    attributes:
      label: Extension ID
      description: "The unique identifier of the extension (format: `publisher.name`)."
      placeholder: e.g., Veverke.chatwizard
    validations:
      required: true

  - type: input
    id: github-repo
    attributes:
      label: GitHub Repository (optional)
      description: "The GitHub repository URL for the extension source code."
      placeholder: e.g., Veverke/ChatWizard
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: "Any additional context or information about the extension."
      placeholder: e.g., This extension is popular in the Python community...
    validations:
      required: false