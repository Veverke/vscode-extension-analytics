# Collect Extension Stats
#
# Purpose: Scheduled data collection pipeline that keeps the time-series stats
# up to date. Runs every 6 hours, fetching the latest install counts, ratings,
# and trending figures from both the VS Code Marketplace and Open VSX for every
# extension listed in data/extensions.json, then commits the new data points
# back to the repository. Can also be triggered manually via workflow_dispatch.
name: Collect Extension Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:         # allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix extension

      # Reads data/extensions.json, fetches stats from both registries in parallel,
      # and appends a new DataPoint to each extension's time-series JSON file
      - run: npx tsx collect/index.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only commits when new data was actually written; [skip ci] prevents a CI loop
      # Pull --rebase first to handle race conditions where another run pushed between checkout and push
      - name: Commit and push data
        run: |
          git config user.name "analytics-bot"
          git config user.email "analytics-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update extension stats [skip ci]"
          git pull --rebase
          git push
