# Deploy to GitHub Pages
#
# Purpose: Builds the React/Vite frontend and publishes it to GitHub Pages
# whenever source code changes are pushed to master. Intentionally skips runs
# triggered solely by data collection commits (data/** changes) or collector
# script changes, since those do not affect the built frontend bundle.
# Can also be triggered manually via workflow_dispatch for out-of-band deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "data/**"
      - "collect/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect Extension Stats"]
    types:
      - completed
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # Produces the optimised static bundle in dist/
      - run: npm run build

      # Configures the GitHub Pages environment for this repository
      - uses: actions/configure-pages@v4

      # Packages dist/ as the Pages artifact to be deployed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Publishes the uploaded artifact; outputs the live page URL
      - id: deployment
        uses: actions/deploy-pages@v4
