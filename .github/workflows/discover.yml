# Discover VS Code Extensions
#
# Purpose: Weekly discovery pipeline that scans the githubRepo fields in the
# existing registry for VS Code extensions. Identifies new extensions by
# engines.vscode in package.json and updates data/extensions.json with any
# newly found ones. Runs every Sunday at midnight UTC and can also be
# triggered manually via workflow_dispatch.
name: Discover VS Code Extensions

on:
  schedule:
    - cron: "0 0 * * 0"  # weekly, Sunday midnight
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # Scans all githubRepo fields in the existing registry for new/updated
      # extension metadata. New extension requests come through the GitHub
      # issue-based tracking request flow instead.
      - run: npx tsx collect/discover.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only commits when the registry actually changed; [skip ci] prevents a CI loop
      - name: Commit and push updated registry
        run: |
          git config user.name "analytics-bot"
          git config user.email "analytics-bot@users.noreply.github.com"
          git add data/extensions.json
          git diff --staged --quiet || git commit -m "chore: update extension registry [skip ci]"
          git push
