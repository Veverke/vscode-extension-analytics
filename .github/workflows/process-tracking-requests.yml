# Process Tracking Requests
#
# Purpose: Automatically process issue-based extension tracking requests.
# Triggered when an issue is opened or reopened.
# Identifies tracking requests by label OR title/body pattern, then:
#   1. Ensures the `tracking-request` label is applied
#   2. Parses the issue body, validates the extension ID, and updates the
#      extensions registry (data/extensions.json) idempotently.
name: Process Tracking Requests

on:
  issues:
    types: [opened, reopened, edited]

jobs:
  process:
    # Run for tracking requests identified by label OR title/body pattern.
    # This ensures the pipeline works even if the label wasn't applied at
    # creation time (e.g. label didn't exist yet, or URL param was ignored).
    if: |
      contains(github.event.issue.labels.*.name, 'tracking-request') ||
      startsWith(github.event.issue.title, '[Tracking Request]') ||
      startsWith(github.event.issue.title, 'Add extension:') ||
      (github.event.issue.body != null && contains(github.event.issue.body, 'Extension ID'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure tracking-request label is applied
        uses: actions/github-script@v7
        with:
          script: |
            // Ensure the tracking-request label exists in the repo first,
            // then apply it to the issue if not already applied.
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: 'tracking-request',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'tracking-request',
                color: '1d76db',
                description: 'Issue requesting that an extension be tracked in the analytics registry',
              });
            }

            const labels = context.payload.issue.labels.map((l) => l.name);
            if (!labels.includes('tracking-request')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: context.issue.number,
                labels: ['tracking-request'],
              });
            }

      - name: Process tracking request
        id: process
        run: |
          # If the issue body is empty (e.g. template wasn't applied),
          # construct a synthetic body from the title as a fallback.
          # Title format: "Add extension: publisher.name" or "[Tracking Request] publisher.name"
          if [ -z "$ISSUE_BODY" ]; then
            EXT_ID=$(echo "$ISSUE_TITLE" | sed -E 's/^(Add extension: |\[Tracking Request\] )//' | xargs)
            if [ -n "$EXT_ID" ]; then
              ISSUE_BODY=$(printf '### Extension ID\n%s' "$EXT_ID")
            fi
          fi
          OUTPUT=$(npx tsx collect/process-tracking-request.ts 2>&1)
          echo "$OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUESTED_BY: ${{ github.event.issue.user.login }}

      - name: Add completion comment
        uses: actions/github-script@v7
        env:
          PROCESS_OUTPUT: ${{ steps.process.outputs.output }}
        with:
          script: |
            const output = JSON.parse(process.env.PROCESS_OUTPUT);
            let commentBody = '';

            if (output.success && output.results.length > 0) {
              const result = output.results[0];
              if (result.action === 'added') {
                commentBody = `✅ ${result.message}\n\nThe extension has been added to the tracking registry and will appear in analytics after the next data collection run.`;
              } else if (result.action === 'updated') {
                commentBody = `ℹ️ ${result.message}\n\nThe extension is now associated with your account and will appear in your dashboard.`;
              } else if (result.action === 'skipped') {
                commentBody = `ℹ️ ${result.message}`;
              }
            } else {
              commentBody = `❌ Tracking request could not be processed.\n\n**Errors:**\n${output.errors.map((e) => '- ' + e).join('\n')}`;
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });

      - name: Commit and push registry update
        if: steps.process.outputs.output != ''
        run: |
          git config user.name 'analytics-bot'
          git config user.email 'analytics-bot@users.noreply.github.com'
          git add data/extensions.json
          git diff --staged --quiet || git commit -m 'chore: update extension registry from tracking request [skip ci]'
          git push

      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Reopen issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'open',
            });

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ The tracking request could not be processed automatically. Please check the workflow logs for details.',
            });