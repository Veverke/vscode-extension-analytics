# Release
#
# Purpose: Produces a versioned GitHub Release for the analytics dashboard.
# Also builds and publishes the VS Code extension (.vsix) to:
#   - VS Code Marketplace (via vsce)
#   - Open VSX Registry (via ovsx)
#
# Triggered by pushing a semver tag (e.g. v1.2.3) or manually via
# workflow_dispatch. Validates the full test suite, verifies that
# package.json version matches the tag, builds the static site and
# extension, creates a GitHub Release with auto-extracted CHANGELOG
# notes, and publishes to both extension registries.
#
# Required secrets:
#   VSCE_TOKEN  — VS Code Publisher PAT (https://marketplace.visualstudio.com/manage)
#   OVSX_TOKEN     — Open VSX PAT (https://open-vsx.org/user-settings/tokens)
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # stable:     v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # pre-release: v1.2.3-beta.1

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v1.2.3)"
        required: true
      dry_run:
        description: "Dry run — package but do not publish"
        type: boolean
        default: false

# Derived values used across jobs
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ─── Job 1: Validate ────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit,release
          name: release-${{ env.TAG }}
          fail_ci_if_error: false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend (used for E2E)
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      # Prevents a mismatch between the git tag and the published package version
      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ env.TAG }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ env.TAG }})"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Build static site
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ─── Job 2: Build & Publish Extension ────────────────────────────────────────
  extension:
    name: Build & Publish Extension
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install root deps (needed for webview build)
      - name: Install root dependencies
        run: npm ci

      # Install extension deps (needed for extension compilation)
      - name: Install extension dependencies
        run: cd extension && npm ci

      # Build the webview bundle first (extension depends on it)
      - name: Build webview bundle
        run: npm run build:webview

      # Compile the extension TypeScript
      - name: Compile extension
        run: cd extension && npm run compile

      # Package the .vsix
      - name: Package VSIX
        run: cd extension && npx vsce package --out vscode-extension-analytics-${{ env.TAG }}.vsix

      # Upload .vsix as artifact (always, even on dry-run)
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/vscode-extension-analytics-${{ env.TAG }}.vsix
          retention-days: 90

      # Publish to VS Code Marketplace (unless dry-run)
      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry_run }}
        run: |
          cd extension
          npx vsce publish \
            --pat "${{ secrets.VSCE_TOKEN }}" \
            --packagePath vscode-extension-analytics-${{ env.TAG }}.vsix

      # Publish to Open VSX Registry (unless dry-run)
      - name: Publish to Open VSX Registry
        if: ${{ !inputs.dry_run }}
        run: |
          cd extension
          npx ovsx publish \
            --pat "${{ secrets.OVSX_TOKEN }}" \
            vscode-extension-analytics-${{ env.TAG }}.vsix

  # ─── Job 3: GitHub Release ───────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [validate, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix/

      # Tries to pull the matching section from CHANGELOG.md; falls back to git log
      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${{ env.TAG }}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?${TAG#v}\]?/{flag=1; next} flag && /^## /{flag=0} flag{print}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}")
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" "${TAG}")
            fi
          fi
          echo "$NOTES" > release-notes.txt
          echo "notes_file=release-notes.txt" >> "$GITHUB_OUTPUT"

      - name: Determine pre-release flag
        id: prerelease
        run: |
          if echo "${{ env.TAG }}" | grep -qE '\-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            vsix/vscode-extension-analytics-${{ env.TAG }}.vsix
            dist/