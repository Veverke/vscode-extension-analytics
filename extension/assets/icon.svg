<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1A2E"/>
      <stop offset="100%" style="stop-color:#1A2D4A"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Subtle inner border glow -->
  <rect x="2" y="2" width="124" height="124" rx="22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <!-- Chart area -->
  <g transform="translate(22, 22)">
    <!-- Grid lines -->
    <line x1="0" y1="64" x2="84" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="48" x2="84" y2="48" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="32" x2="84" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="16" x2="84" y2="16" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="84" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Bottom axis -->
    <line x1="0" y1="64" x2="84" y2="64" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Bar 1 (blue) -->
    <rect x="2" y="40" width="14" height="24" rx="3" fill="url(#bar1)" filter="url(#glow)"/>
    <rect x="3" y="40" width="12" height="4" rx="1.5" fill="rgba(255,255,255,0.25)"/>
    
    <!-- Bar 2 (purple) -->
    <rect x="22" y="26" width="14" height="38" rx="3" fill="url(#bar2)" filter="url(#glow)"/>
    <rect x="23" y="26" width="12" height="4" rx="1.5" fill="rgba(255,255,255,0.25)"/>
    
    <!-- Bar 3 (green) -->
    <rect x="42" y="14" width="14" height="50" rx="3" fill="url(#bar3)" filter="url(#glow)"/>
    <rect x="43" y="14" width="12" height="4" rx="1.5" fill="rgba(255,255,255,0.25)"/>
    
    <!-- Bar 4 (pink) -->
    <rect x="62" y="22" width="14" height="42" rx="3" fill="url(#bar4)" filter="url(#glow)"/>
    <rect x="63" y="22" width="12" height="4" rx="1.5" fill="rgba(255,255,255,0.25)"/>
    
    <!-- Trend line going up -->
    <polyline points="4,36 24,22 44,10 64,18" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Trend line glow -->
    <polyline points="4,36 24,22 44,10 64,18" stroke="rgba(96,165,250,0.4)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Dot markers on trend line -->
    <circle cx="4" cy="36" r="2.5" fill="#60A5FA"/>
    <circle cx="24" cy="22" r="2.5" fill="#A78BFA"/>
    <circle cx="44" cy="10" r="2.5" fill="#34D399"/>
    <circle cx="64" cy="18" r="2.5" fill="#F472B6"/>
  </g>
</svg>