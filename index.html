<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VS Code Extension Analytics</title>
    <script>
      // GitHub Pages SPA workaround: decode path stored by 404.html as a query string
      ;(function () {
        var redirect = sessionStorage.getItem('gh-pages-redirect')
        if (redirect) {
          sessionStorage.removeItem('gh-pages-redirect')
          var url = new URL(redirect, window.location.origin)
          var base = window.location.pathname
          var routePath = url.pathname.startsWith(base)
            ? url.pathname.slice(base.length - 1) || '/'
            : '/'
          history.replaceState(null, '', base + '#' + routePath + url.search)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
